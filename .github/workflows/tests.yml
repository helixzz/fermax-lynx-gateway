name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil python3-protobuf python3-pycryptodome python3-enet python3-av python3-evdev
      - name: Public test suite
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Ringtone playback lifecycle
        run: node tests/ringtone.cjs
