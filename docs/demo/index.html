gure><figure id="view-21" hidden><figcaption><h2>连接中断 · Offline</h2><p>状态清楚呈现，断线时禁用控制。</p></figcaption><a href="phone-offline.webp"><img src="phone-offline.webp" alt="连接中断 · Offline" loading="lazy"></a></figure><figure id="view-22" hidden><figcaption><h2>授权撤销 · Revoked</h2><p>撤销后退出话机，重新授权才能使用。</p></figcaption><a href="phone-revoked.webp"><img src="phone-revoked.webp" alt="授权撤销 · Revoked" loading="lazy"></a></figure><figure id="view-23" hidden><figcaption><h2>限时自动开门 · Timed policy</h2><p>已启用时仅显示状态、截止时间和停止按钮。</p></figcaption><a href="admin-auto-timed.webp"><img src="admin-auto-timed.webp" alt="限时自动开门 · Timed policy" loading="lazy"></a></figure><figure id="view-24" hidden><figcaption><h2>无时限自动开门 · Unlimited policy</h2><p>只提供停止操作，隐藏再次启用和时长选择。</p></figcaption><a href="admin-auto-unlimited.webp"><img src="admin-auto-unlimited.webp" alt="无时限自动开门 · Unlimited policy" loading="lazy"></a></figure><figure id="view-25" hidden><figcaption><h2>管理页失联 · Unknown policy state</h2><p>无法确认服务器状态时隐藏策略操作，恢复后重新读取。</p></figcaption><a href="admin-offline.webp"><img src="admin-offline.webp" alt="管理页失联 · Unknown policy state" loading="lazy"></a></figure><figure id="view-26" hidden><figcaption><h2>放大管理页 · 200% layout</h2><p>导航自然换行，入口按钮不重叠。</p></figcaption><a href="admin-zoom.webp"><img src="admin-zoom.webp" alt="放大管理页 · 200% layout" loading="lazy"></a></figure><figure id="view-27" hidden><figcaption><h2>设置导航 · Settings navigation</h2><p>铃声、话机设备、网关配置和密码按任务分区。</p></figcaption><a href="admin-settings.webp"><img src="admin-settings.webp" alt="设置导航 · Settings navigation" loading="lazy"></a></figure><figure id="view-28" hidden><figcaption><h2>16 首铃声 · Ringtone library</h2><p>点击选择并试听，保存后用于下一次来访。</p></figcaption><a href="admin-ringtone-library.webp"><img src="admin-ringtone-library.webp" alt="16 首铃声 · Ringtone library" loading="lazy"></a></figure><figure id="view-29" hidden><figcaption><h2>管理员登录 · Sign in</h2><p>独立的管理员登录入口。</p></figcaption><a href="admin-login.webp"><img src="admin-login.webp" alt="管理员登录 · Sign in" loading="lazy"></a></figure><figure id="view-30" hidden><figcaption><h2>管理首页 · Dashboard</h2><p>网关、入口、策略与活动概览。</p></figcaption><a href="admin-dashboard.webp"><img src="admin-dashboard.webp" alt="管理首页 · Dashboard" loading="lazy"></a></figure><figure id="view-31" hidden><figcaption><h2>内置铃声 · Built-in melodies</h2><p>管理员配置铃声及 15/30/45/60 秒时长。</p></figcaption><a href="admin-ringtone.webp"><img src="admin-ringtone.webp" alt="内置铃声 · Built-in melodies" loading="lazy"></a></figure><figure id="view-32" hidden><figcaption><h2>自定义音乐 · Custom music</h2><p>导入、试听并保存自己的音乐。</p></figcaption><a href="admin-custom-music.webp"><img src="admin-custom-music.webp" alt="自定义音乐 · Custom music" loading="lazy"></a></figure><figure id="view-33" hidden><figcaption><h2>网关配置 · Configuration</h2><p>身份、接口与入口配置；保存不改变系统网卡地址。</p></figcaption><a href="admin-network.webp"><img src="admin-network.webp" alt="网关配置 · Configuration" loading="lazy"></a></figure><figure id="view-34" hidden><figcaption><h2>密码设置 · Password</h2><p>修改管理员密码。</p></figcaption><a href="admin-password.webp"><img src="admin-password.webp" alt="密码设置 · Password" loading="lazy"></a></figure><figure id="view-35" hidden><figcaption><h2>事件日志 · Journal</h2><p>查询并导出网关活动记录。</p></figcaption><a href="admin-journal.webp"><img src="admin-journal.webp" alt="事件日志 · Journal" loading="lazy"></a></figure><figure id="view-36" hidden><figcaption><h2>设备管理 · Devices</h2><p>查看设备授权及其入口范围。</p></figcaption><a href="admin-devices.webp"><img src="admin-devices.webp" alt="设备管理 · Devices" loading="lazy"></a></figure></section></main><script>
